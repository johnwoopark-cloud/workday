<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>로그인</title>
  <link rel="stylesheet" href="./auth.css">
</head>
<body>
  <main class="card">
    <div class="card__accent"></div>
    <div class="card__body">
      <p class="brand">KBS미디어 법무저작권팀 일정</p>
      <h1>로그인</h1>
      <p class="sub">등록된 이메일과 비밀번호로 로그인하세요.</p>

      <div class="field">
        <label for="email">이메일</label>
        <input type="email" id="email" autocomplete="username" placeholder="name@example.com">
      </div>

      <div class="field">
        <label for="password">비밀번호</label>
        <input type="password" id="password" autocomplete="current-password" placeholder="비밀번호">
      </div>

      <button id="loginBtn">로그인</button>

      <p class="msg" id="msg"></p>

      <div class="foot">
        <span>비밀번호를 잊으셨나요?</span>
        <span>관리자에게 문의하세요</span>
      </div>
    </div>
  </main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // 설정 (app.js와 동일한 값)
    const SUPABASE_URL = "https://vxvpjhaxplrqlxyyzxlo.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ4dnBqaGF4cGxycWx4eXl6eGxvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODExNDM2MDUsImV4cCI6MjA5NjcxOTYwNX0.pfcnUPN82_OA-w3jl3Xf0Kbjsdj9t2EqV2yyCYGJ7NU";
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const APP_HOME = "./index.html";

    const emailEl = document.getElementById("email");
    const pwEl = document.getElementById("password");
    const btn = document.getElementById("loginBtn");
    const msg = document.getElementById("msg");

    function showMsg(text, kind) {
      msg.textContent = text;
      msg.className = "msg show msg--" + kind;
    }

    (async () => {
      const { data: { session } } = await _supabase.auth.getSession();
      if (session) location.href = APP_HOME;
    })();

    async function doLogin() {
      const email = emailEl.value.trim();
      const password = pwEl.value;
      if (!email || !password) {
        showMsg("이메일과 비밀번호를 모두 입력하세요.", "error");
        return;
      }
      btn.disabled = true;
      btn.textContent = "로그인 중…";
      const { data, error } = await _supabase.auth.signInWithPassword({ email, password });
      if (error) {
        showMsg("로그인 실패: 이메일 또는 비밀번호를 확인하세요.", "error");
        btn.disabled = false;
        btn.textContent = "로그인";
        return;
      }
      const mustChange = data.user?.user_metadata?.must_change_password;
      location.href = mustChange ? "./account.html?forced=1" : APP_HOME;
    }

    btn.addEventListener("click", doLogin);
    [emailEl, pwEl].forEach(el =>
      el.addEventListener("keydown", e => { if (e.key === "Enter") doLogin(); })
    );
  </script>
  
</body>
</html>
