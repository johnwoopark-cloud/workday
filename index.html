<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026년 법무저작권팀 근태 현황</title>

    <!-- 한글에 잘 맞는 Pretendard 폰트 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>
</head>
<body>
    <header class="app-header">
        <h1>🗓️ 2026 법무저작권팀 근태 캘린더</h1>
    </header>

    <div class="app-body">
        <!-- ===== 왼쪽: 입력 + 필터 ===== -->
        <aside class="sidebar">
            <!-- 근태 등록 -->
            <section class="panel">
                <h2 class="panel-title">근태 기록 등록</h2>
                <form id="attendance-form">
                    <label>직원 선택</label>
                    <select id="select-employee" required></select>

                    <label>구분 종류</label>
                    <select id="select-type" required onchange="toggleFormFields()">
                        <option value="">-- 선택하세요 --</option>
                        <optgroup label="출퇴근">
                            <option value="9시~6시">9시 ~ 6시</option>
                            <option value="10시~7시">10시 ~ 7시</option>
                            <option value="8시~5시">8시 ~ 5시</option>
                            <option value="7시~4시">7시 ~ 4시</option>
                        </optgroup>
                        <optgroup label="휴가">
                            <option value="휴가">휴가 (전일)</option>
                            <option value="오전">오전 반차</option>
                            <option value="오후">오후 반차</option>
                        </optgroup>
                        <optgroup label="근무 외 일정">
                            <option value="출장">출장</option>
                            <option value="외근">외근</option>
                            <option value="교육">교육</option>
                            <option value="회의">회의</option>
                            <option value="건강검진">건강검진</option>
                        </optgroup>
                        <option value="기타">기타</option>
                        <optgroup label="관리">
                            <option value="삭제">🗑️ 기존 내용 삭제</option>
                        </optgroup>
                    </select>

                    <div class="date-row">
                        <div>
                            <label>시작일</label>
                            <input type="date" id="input-start-date" required>
                        </div>
                        <div>
                            <label>종료일 <span class="muted">(당일이면 생략)</span></label>
                            <input type="date" id="input-end-date">
                        </div>
                    </div>

                    <label>메모 / 특이사항</label>
                    <input type="text" id="input-notes" placeholder="예: 외근, 늦은 퇴근 등">

                    <button type="submit" class="btn-primary">기록 저장하기</button>
                    <p class="hint">※ 주말·공휴일은 자동 제외됩니다. 달력의 기록을 클릭하면 개별 삭제됩니다.</p>
                </form>
            </section>

            <!-- 표시할 팀원 필터 (다중 선택) -->
            <section class="panel">
                <h2 class="panel-title">표시할 팀원</h2>
                <div class="filter-actions">
                    <button type="button" id="filter-select-all" class="btn-mini">전체 선택</button>
                    <button type="button" id="filter-clear-all" class="btn-mini">전체 해제</button>
                </div>
                <div id="employee-filter" class="filter-list"></div>
                <p class="hint">아무도 선택하지 않으면 전체 팀원의 일정이 표시됩니다.</p>
            </section>

            <!-- 범례 -->
            <section class="panel">
                <h2 class="panel-title">구분 색상</h2>
                <div id="legend" class="legend"></div>
            </section>
        </aside>

        <!-- ===== 오른쪽: 큰 달력 ===== -->
        <main class="calendar-section">
            <div id="calendar"></div>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
