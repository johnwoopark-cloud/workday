<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2026년 법무저작권팀 근태 현황</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="style.css">
  <!-- 라이브러리 (각각 한 번씩만) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>
  <!-- app.js 는 본문 맨 아래에서 딱 한 번만 로드합니다 -->
</head>
<body>
    <header class="app-header">
        <h1>🗓️ 2026 법무저작권팀 근태 캘린더</h1>
        <div class="header-user">
            <span id="current-user" class="user-email"></span>
            <a href="./account.html" id="change-pw" class="btn-logout" style="text-decoration:none;">비밀번호 변경</a>
            <button id="logout-btn" type="button" class="btn-logout">로그아웃</button>
        </div>
    </header>

    <!-- ===== 로그인 화면 (미로그인 시 전체 덮음) ===== -->
    <div id="login-view" class="login-view">
        <div class="login-card">
            <h2 class="login-title">로그인</h2>
            <p class="login-sub">법무저작권팀 근태 캘린더</p>
            <form id="login-form">
                <label>이메일</label>
                <input type="email" id="login-email" autocomplete="username" required>
                <label>비밀번호</label>
                <input type="password" id="login-password" autocomplete="current-password" required>
                <p id="login-error" class="login-error"></p>
                <button type="submit" id="login-btn" class="btn-primary">로그인</button>
            </form>
        </div>
    </div>

    <div class="app-body" id="app-view" style="display:none;">
        <!-- ===== 왼쪽: 입력 + 필터 ===== -->
        <aside class="sidebar">
            <p id="user-notice" class="user-notice" style="display:none;"></p>
            <!-- 근태 등록 -->
            <section class="panel">
                <h2 class="panel-title">근태 기록 등록</h2>
                <form id="attendance-form">
                    <label>직원 선택</label>
                    <select id="select-employee" required></select>

                    <label>구분 종류</label>
                    <select id="select-type" required onchange="toggleFormFields()">
                        <option value="">-- 선택하세요 --</option>
                        <optgroup label="출퇴근">
                            <option value="9시~6시">9시 ~ 6시</option>
                            <option value="10시~7시">10시 ~ 7시</option>
                            <option value="8시~5시">8시 ~ 5시</option>
                            <option value="7시~4시">7시 ~ 4시</option>
                        </optgroup>
                        <optgroup label="휴가">
                            <option value="휴가">휴가 (전일)</option>
                            <option value="오전">오전 반차</option>
                            <option value="오후">오후 반차</option>
                        </optgroup>
                        <optgroup label="근무 외 일정">
                            <option value="출장">출장</option>
                            <option value="외근">외근</option>
                            <option value="교육">교육</option>
                            <option value="회의">회의</option>
                            <option value="건강검진">건강검진</option>
                        </optgroup>
                        <option value="기타">기타</option>
                        <optgroup label="관리">
                            <option value="삭제">🗑️ 기존 내용 삭제</option>
                        </optgroup>
                    </select>

                    <div class="date-row">
                        <div>
                            <label>시작일</label>
                            <input type="date" id="input-start-date" required>
                        </div>
                        <div>
                            <label>종료일 <span class="muted">(당일이면 생략)</span></label>
                            <input type="date" id="input-end-date">
                        </div>
                    </div>

                    <label>메모 / 특이사항</label>
                    <input type="text" id="input-notes" placeholder="예: 외근, 늦은 퇴근 등">

                    <button type="submit" class="btn-primary">기록 저장하기</button>
                    <p class="hint">※ 주말·공휴일은 자동 제외됩니다.<br> <b>달력의 기록을 클릭하면 개별 삭제됩니다.</b></p>
                </form>
            </section>

            <!-- 표시할 팀원 필터 (다중 선택) - 관리자만 표시 -->
            <section class="panel" id="filter-panel">
                <h2 class="panel-title">표시할 팀원</h2>
                <div class="filter-actions">
                    <button type="button" id="filter-select-all" class="btn-mini">전체 선택</button>
                    <button type="button" id="filter-clear-all" class="btn-mini">전체 해제</button>
                </div>
                <div id="employee-filter" class="filter-list"></div>
                <p class="hint">아무도 선택하지 않으면 전체 팀원의 일정이 표시됩니다.</p>
            </section>

            <!-- 범례 -->
            <section class="panel">
                <h2 class="panel-title">구분 색상</h2>
                <div id="legend" class="legend"></div>
            </section>
        </aside>

        <!-- ===== 오른쪽: 큰 달력 ===== -->
        <main class="calendar-section">
            <div id="calendar"></div>
        </main>
    </div>

    <!-- app.js 는 여기서 딱 한 번만 (DOM이 다 만들어진 뒤 실행되도록 맨 아래) -->
    <script src="app.js"></script>
</body>
</html>
