<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026년 법무저작권팀 근태 현황</title>
    <link rel="stylesheet" href="style.css">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>
</head>
<body>
    <div class="container">
        <h1>🗓️ 2026 법무저작권팀 근태 캘린더</h1>

        <section class="form-section">
<h2>근태 기록 등록</h2>
            <form id="attendance-form">
                <label>직원 선택:</label>
                <select id="select-employee" required></select>

                <label>구분 종류:</label>
             <select id="select-type" required onchange="toggleFormFields()">
    <option value="">-- 선택하세요 --</option>
    <option value="9시~6시">9시 ~ 6시 (출퇴근)</option>
    <option value="10시~7시">10시 ~ 7시 (출퇴근)</option>
    <option value="8시~5시">8시 ~ 5시 (출퇴근)</option>
    <option value="7시~4시">7시 ~ 4시 (출퇴근)</option>
    <option value="휴가">휴가 (전일)</option>
    <option value="오전">오전 반차</option>
    <option value="오후">오후 반차</option>
</select>

                <div style="display: table; width: 100%; margin-top: 5px;">
                    <div style="display: table-cell; width: 48%;">
                        <label style="padding-left:0;">시작일:</label>
                        <input type="date" id="input-start-date" required>
                    </div>
                    <div style="display: table-cell; width: 4%;"></div>
                    <div style="display: table-cell; width: 48%;">
                        <label style="padding-left:0;">종료일 (당일이면 생략 가능):</label>
                        <input type="date" id="input-end-date">
                    </div>
                </div>

                <label>메모/특이사항:</label>
                <input type="text" id="input-notes" placeholder="예: 외근, 늦은 퇴근 등">

                <button type="submit">기록 저장하기</button>
            </form>            
        </section>

        <section class="calendar-section">
            <div id="calendar"></div>
        </section>
    </div>

    <script src="app.js"></script>
</body>
</html>
